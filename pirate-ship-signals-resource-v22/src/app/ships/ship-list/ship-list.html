<div class="card">
  <div class="header">
    {{ pageTitle }}
  </div>

  @if (isLoading()) {
    <div class="ship-list-loading">...Loading</div>
  } @else if (error(); as error) {
    <div class="ship-list-error">
      {{ error.message }}
    </div>
  } @else {
    <div class="body">
      <div class="row">
        <select class="ship-list-select" [(ngModel)]="selectedShip">
          <option [ngValue]="undefined">--Select a ship--</option>
          @for (ship of ships(); track ship.ship_id) {
            <option [ngValue]="ship">{{ ship.name }}</option>
          }
        </select>
        <button class="refresh-btn" (click)="refreshData()">Refresh</button>
      </div>
    </div>
  }
</div>
